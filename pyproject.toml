[project]
name = "agent-overlord"
version = "0.1.0"
description = "A tmux-native control plane for supervising agent sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "mcp>=1.0",
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "textual>=1.0",
    "uvicorn>=0.34",
]

[project.scripts]
agent-overlord = "agent_overlord.app:main"

[dependency-groups]
dev = [
    "honcho>=2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_overlord"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
